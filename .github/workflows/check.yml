---
name: check

# Controls when the workflow will run
# yamllint disable-line rule:truthy
on:
  # Triggers the workflow on push or pull request events
  # but only for the "main" and "develop" branch
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Triggers the workflow on 3am every day
  schedule:
    - cron: '0 3 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency: testing_environment
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # A generated package's `task check:offline` runs the checks in `bin/`
      # with `uv run`, which resolves their dependencies from each script's
      # inline PEP 723 metadata. Generated packages meet uv in their own
      # pipeline image, which already installs cmemc with it; this repository
      # installs cmemc with pip, so it has to ask for uv explicitly.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: install copier
        run: |
          python3 -m pip install --user 'copier>=9.0.0'

      - name: install cmemc
        run: |
          python3 -m pip install --user cmem-cmemc==26.2.1

      - name: create projects with default answers and run check
        env:
          CMEM_BASE_URI: ${{ secrets.CMEM_BASE_URI }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          task check

