---
name: check

# Controls when the workflow will run
# yamllint disable-line rule:truthy
on:
  # Triggers the workflow on push or pull request events
  # but only for the "main" and "develop" branch
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Triggers the workflow on 3am every day
  schedule:
    - cron: '0 3 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency: testing_environment
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # A generated package needs uv twice over: its `task check:offline` runs
      # the checks in `bin/` by path through their `uv run --script` shebang,
      # and every task that talks to Corporate Memory runs the cmemc release
      # pinned in the generated Taskfile.yaml through uvx. Generated packages
      # meet uv in their own pipeline image; this runner has to ask for it.
      # No cmemc is installed here for the same reason as there.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: install copier
        run: |
          python3 -m pip install --user 'copier>=9.0.0'

      - name: create projects with default answers and run check
        env:
          CMEM_BASE_URI: ${{ secrets.CMEM_BASE_URI }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          task check

