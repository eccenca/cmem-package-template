# https://taskfile.dev
#
# This is a generated file. We dot not suggest to edit it.
# Instead, create a file `TaskfileCustom.yaml` and add your additions there.
---
version: '3'

dotenv: ['.copier-answers.env', '.env']

vars:
  PACKAGE_DIR: $package_dir
  PACKAGE_ID: $package_id
  DIST_DIR: dist
  GIT_DESCRIBE:
    sh: git describe --tags --always --dirty 2>/dev/null || echo ""
  PACKAGE_VERSION:
    sh: echo {{if regexMatch "^v.*" .GIT_DESCRIBE}}{{.GIT_DESCRIBE}}{{else}}v0.0.0-{{.GIT_DESCRIBE}}{{end}}

includes:
  custom:
    taskfile: ./TaskfileCustom.yaml
    optional: true
    flatten: true

tasks:

  default:
    summary: |
      Just a list of documented tasks
    silent: true
    cmds:
      - task --list

  clean:
    desc: Removes dist, *.cpa, ...
    cmds:
      - rm -rf {{.DIST_DIR}} *.cpa

  check:
    desc: Run whole test suite
    cmds:
      - task: check:offline
      - task: build
      - cmemc package install --replace --input {{.DIST_DIR}}/{{.PACKAGE_ID}}-{{.PACKAGE_VERSION}}.cpa
      - cmemc package uninstall {{.PACKAGE_ID}}

  check:offline:
    desc: Check shipped RDF without a Corporate Memory connection
    summary: |
      Runs the checks in bin/ over the package directory: dangling shape,
      group and query references, the query placeholder declarations, every
      property shape's shacl:path against the vocabulary, the shipped
      queries against the documenting-a-query convention, and the names of the
      package's own attributes against the vocabulary skill's naming rules.

      These need no instance, no credentials and no install - and two of the
      mistakes they catch stay invisible until after one. A dangling
      sh:property / sh:node / sh:group / sh:sparql reference makes the SHACL
      service answer HTTP 500 for every graph, with nothing naming the cause.
      A shacl:path that reaches nothing leaves shacl:class, shacl:nodeKind and
      every cardinality on that row with nothing to check, so validation passes
      and proves nothing.

      A package with no shape catalog passes with a note once its names are
      checked: every other check here is catalog-driven. The project's own skill map, .claude/skill-map.custom.json,
      is validated too, so a broken rule cannot switch its reminders off unseen.
    preconditions:
      - sh: command -v uv
        msg: "The checks in bin/ run through uv (PEP 723 scripts). Install it: https://docs.astral.sh/uv/"
    cmds:
      - bin/check_all.py {{.PACKAGE_DIR}}

  layout:
    desc: Lay out the workflows of the build projects as a waterfall
    summary: |
      Rewrites only posX/posY in the exported workflow XML of every project
      under projects/ (and build/, for a package that has not moved), so a
      workflow reads left to right and top to bottom: order as columns, then
      input, working and one lane per graph written. The workflows skill
      describes the layout.

      Not part of check:offline, and task export does not run it: run it after
      an export in which nodes were moved, and review the diff - a deliberate
      arrangement is yours to keep.
    preconditions:
      - sh: command -v uv
        msg: "bin/layout_workflows.py runs through uv (PEP 723). Install it: https://docs.astral.sh/uv/"
    cmds:
      - for p in {{.PACKAGE_DIR}}/projects/*/ {{.PACKAGE_DIR}}/build/*/; do [ -d "$p" ] || continue; bin/layout_workflows.py --write "$p" || exit 1; done

  layout:check:
    desc: Report workflows that depart from the waterfall layout
    summary: |
      The same layout as task layout, without writing: exits non-zero and names
      each workflow whose positions differ. A package that wants the layout as a
      gate adds this task to its check:custom.
    preconditions:
      - sh: command -v uv
        msg: "bin/layout_workflows.py runs through uv (PEP 723). Install it: https://docs.astral.sh/uv/"
    cmds:
      - for p in {{.PACKAGE_DIR}}/projects/*/ {{.PACKAGE_DIR}}/build/*/; do [ -d "$p" ] || continue; bin/layout_workflows.py --check "$p" || exit 1; done

  tags:
    desc: Write the tags of task-tags.json into the build projects' exports
    summary: |
      task-tags.json at the repository root lists the tags of every task per
      build project, the projects' own tags and the external systems. This
      writes them into the exports under projects/ (and build/), after the
      register passed the tag axes of the build-projects skill. Run it after
      every export: a task created through the API often loses its tags there.

      A package without task-tags.json keeps its tags in the exports only;
      bin/task_tags.py --from-exports <package dir> writes a first register.
    preconditions:
      - sh: command -v uv
        msg: "bin/task_tags.py runs through uv (PEP 723). Install it: https://docs.astral.sh/uv/"
    cmds:
      - bin/task_tags.py --write {{.PACKAGE_DIR}}

  tags:check:
    desc: Report exports whose tags differ from task-tags.json, or a register that breaks the tag axes
    summary: |
      Writes nothing. Tags are a set, so an export that only reorders them
      passes. Passes with a note when the package has no task-tags.json. A
      package that wants it as a gate adds this task to its check:custom.
    preconditions:
      - sh: command -v uv
        msg: "bin/task_tags.py runs through uv (PEP 723). Install it: https://docs.astral.sh/uv/"
    cmds:
      - bin/task_tags.py --check {{.PACKAGE_DIR}}

  build:
    desc: Build package archive
    preconditions:
      - sh: git describe --tags --always --dirty 2>/dev/null
        msg: "Package directory must be a git repository. Run: git init; git add .; git commit -m 'init'"
      # Shell builtins only, so the check runs in Task's own shell on every platform.
      - sh: 'test ! -e LICENSE || { read -r first < LICENSE; case "$first" in "Replace this file"*) exit 1;; esac; }'
        msg: "LICENSE still holds the template's placeholder. Replace it with the full text of the licence in cpa-manifest.json (metadata.license)."
    deps:
      - clean
    cmds:
      - >
        cmemc package build {{.PACKAGE_DIR}}
        --output-dir {{.DIST_DIR}}
        --version {{.PACKAGE_VERSION}}

  import:
    desc: Import (install) package to Corporate Memory
    summary: |
      Installs straight from the package directory, with no archive in
      between - the inner loop.

      The offline checks run first, because this is the task that puts a
      catalog on a live instance, and a dangling reference in it makes the
      SHACL service answer HTTP 500 for every graph on that deployment. They
      run before the installed package is deleted, so a failed check leaves
      the instance as it was.
    cmds:
      - task: check:offline
      - task: delete
      - cmemc package install --input {{.PACKAGE_DIR}}

  export:
    desc: Export package content from Corporate Memory
    cmds:
      - cmemc package export --replace --extract {{.PACKAGE_ID}}

  delete:
    desc: Delete (uninstall) package from Corporate Memory
    cmds:
      - cmd: cmemc package uninstall {{.PACKAGE_ID}}
        ignore_error: true

  publish:
    desc: Publish package archive to the marketplace
    preconditions:
      - sh: test -f {{.DIST_DIR}}/{{.PACKAGE_ID}}-{{.PACKAGE_VERSION}}.cpa
        msg: >
          No package archive for version {{.PACKAGE_VERSION}} found in
          {{.DIST_DIR}}. Run 'task build' first.
    cmds:
      - cmemc package publish {{.DIST_DIR}}/{{.PACKAGE_ID}}-{{.PACKAGE_VERSION}}.cpa

